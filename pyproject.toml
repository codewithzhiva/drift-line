[project]
name="drift-line"
version="0.1.0"
requires-python=">=3.12"
dependencies=["fastapi>=0.115,<1","uvicorn[standard]>=0.34,<1"]
[dependency-groups]
dev=["httpx>=0.28,<1","pytest>=9.1.1,<10","ruff>=0.11,<1","mypy>=1.15,<2"]
[tool.pytest.ini_options]
pythonpath=["."]
[tool.ruff]
line-length=110
[tool.ruff.lint]
select=["E","F","I","B","UP"]
